[package]
name = "qubit-batch"
version = "0.12.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-batch"
description = "One-shot batch execution and processing with sequential and scoped parallel utilities"
homepage = "https://github.com/qubit-ltd/rs-batch"
documentation = "https://docs.rs/qubit-batch"
readme = "README.md"
keywords = ["batch", "progress", "executor", "parallel", "processing"]
categories = ["concurrency", "development-tools"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/doc/design*.md",
    "/doc/performance*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_batch"
doctest = true

[dependencies]
crossbeam-queue = "0.3"
crossbeam-channel = "0.5"
thiserror = "2.0"
loom = { version = "0.7", optional = true }
qubit-atomic = "0.17"
qubit-function = "0.18"
qubit-progress = { version = "0.8", default-features = false }

[features]
loom-tests = ["dep:loom"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "batch_executor_bench"
harness = false

[[bench]]
name = "scheduling_matrix_bench"
harness = false

[[bench]]
name = "call_fallback_bench"
harness = false

[[bench]]
name = "chunk_buffer_bench"
harness = false
